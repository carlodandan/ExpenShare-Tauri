name: Build ExpenShare

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'package.json'

jobs:
  build-windows:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ExpenShare v__VERSION__'
          releaseDraft: false
          prerelease: false

  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Rust cargo-ndk
        run: cargo install cargo-ndk

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Initialize Android project
        run: pnpm tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Build Android APK
        run: pnpm tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Get version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Sign APK
        run: |
          # Generate a signing keystore
          keytool -genkey -v -keystore release.keystore -alias expenshare -keyalg RSA -keysize 2048 -validity 10000 -storepass expenshare123 -keypass expenshare123 -dname "CN=ExpenShare, OU=App, O=ExpenShare, L=City, S=State, C=US"
          
          # Locate build tools containing zipalign and apksigner
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Find the unsigned release APK
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" -o -name "*.apk" | head -n 1)
          SIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/ExpenShare-v${{ steps.pkg.outputs.version }}.apk"
          
          echo "Found unsigned APK: $UNSIGNED_APK"
          
          # Align and sign with v2/v3 signing schemes (required by Android 11, 12, 13, 14, 15)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias expenshare --ks-pass pass:expenshare123 --key-pass pass:expenshare123 --out "$SIGNED_APK" aligned.apk
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: src-tauri/gen/android/app/build/outputs/apk/ExpenShare-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
