name: Build ExpenShare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  build-windows:
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      # Builds the NSIS + MSI installers and publishes a GitHub release with
      # the installers plus the `latest.json` updater manifest that
      # tauri.conf.json's `plugins.updater.endpoints` points at. Requires
      # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # secrets - see MIGRATION.md for how to generate the keypair.
      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ExpenShare v__VERSION__'
          releaseDraft: false
          prerelease: false